name = "nit-mcp-hudu"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "7ac71ffa8a171e8755646124094cb9f3"

[vars]
HUDU_BASE_URL = "https://docs.networkzit.com/api/v1"
ENTRA_TENANT_ID = "6c9b4558-affd-4a18-9494-fb95f1ed92d1"
PUBLIC_BASE_URL = "https://hudu-mcp.networkzit.com"

# Secrets (push via: wrangler secret put <NAME>):
# HUDU_API_KEY
# ENTRA_CLIENT_ID
# ENTRA_CLIENT_SECRET

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "d9b8b556d4494eecaef4a5529e925297"

# Clean up the Durable Object class that was previously deployed with the
# agents/McpAgent pattern. We now use WebStandardStreamableHTTPServerTransport
# directly, so the DO and its SQLite storage are no longer needed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HuduMcp"]

[[migrations]]
tag = "v2"
deleted_classes = ["HuduMcp"]

[observability.traces]
enabled = true
destinations = [ "grafana-traces" ]

[observability.logs]
enabled = true
destinations = [ "grafana-logs" ]
