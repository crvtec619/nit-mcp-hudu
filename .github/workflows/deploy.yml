name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Security audit (moderate and above)
        run: npm audit --audit-level=moderate

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Cloudflare Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.HUDU_API_KEY }}" | npx wrangler secret put HUDU_API_KEY
          echo "${{ secrets.ENTRA_CLIENT_ID }}" | npx wrangler secret put ENTRA_CLIENT_ID
          echo "${{ secrets.ENTRA_CLIENT_SECRET }}" | npx wrangler secret put ENTRA_CLIENT_SECRET
          echo "${{ secrets.HUDU_WRITE_ALLOWLIST }}" | npx wrangler secret put HUDU_WRITE_ALLOWLIST
