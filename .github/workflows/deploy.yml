name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Cloudflare Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.HUDU_API_KEY }}" | npx wrangler secret put HUDU_API_KEY
          echo "${{ secrets.ENTRA_CLIENT_ID }}" | npx wrangler secret put ENTRA_CLIENT_ID
          echo "${{ secrets.ENTRA_CLIENT_SECRET }}" | npx wrangler secret put ENTRA_CLIENT_SECRET
